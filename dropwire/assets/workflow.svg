<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800&amp;family=JetBrains+Mono:wght@700&amp;family=Satoshi:wght@500;700&amp;display=swap');
      .bg { fill: #F4EFEA; }
      .text-ink { fill: #0B1016; }
      .text-cream { fill: #F4EFEA; }
      .text-soft { fill: #222C37; }
      .blue { fill: #0052FF; }
      .yellow { fill: #FFB800; }
      .orange { fill: #FF3D00; }
      .green { fill: #00B060; }
      
      .display { font-family: 'Cabinet Grotesk', system-ui, sans-serif; font-weight: 800; }
      .sans { font-family: 'Satoshi', system-ui, sans-serif; font-weight: 700; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
      
      .shadow { filter: drop-shadow(0 12px 30px rgba(11,16,22,0.06)); }
      .card { fill: #FFFFFF; rx: 12px; }
    </style>
  </defs>

  <rect width="1000" height="300" class="bg" />
  
  <g transform="translate(50, 40)">
    <!-- Sender Node -->
    <rect x="0" y="50" width="200" height="120" class="card shadow" />
    <rect x="0" y="50" width="200" height="8" fill="#0052FF" rx="4" />
    <text x="100" y="100" class="display text-ink" font-size="24" text-anchor="middle">SENDER</text>
    <text x="100" y="125" class="mono text-soft" font-size="14" text-anchor="middle">$ dropwire send</text>
    <rect x="20" y="145" width="160" height="4" rx="2" class="bg" />

    <!-- Connection Line 1 -->
    <path d="M 210 110 L 380 110" fill="none" stroke="#FFB800" stroke-width="4" stroke-dasharray="8 8" />
    <text x="295" y="95" class="sans text-soft" font-size="14" text-anchor="middle">SPAKE2 Handshake</text>

    <!-- Relay / P2P Node -->
    <rect x="390" y="50" width="120" height="120" rx="60" class="yellow shadow" />
    <text x="450" y="108" class="display text-ink" font-size="20" text-anchor="middle">RELAY</text>
    <text x="450" y="128" class="sans text-ink" font-size="12" text-anchor="middle">TCP/UDP</text>

    <!-- Connection Line 2 -->
    <path d="M 520 110 L 690 110" fill="none" stroke="#FFB800" stroke-width="4" stroke-dasharray="8 8" />
    <text x="605" y="95" class="sans text-soft" font-size="14" text-anchor="middle">End-to-End Encrypted</text>
    <text x="605" y="130" class="mono text-soft" font-size="12" text-anchor="middle">ChaCha20Poly1305</text>

    <!-- Receiver Node -->
    <rect x="700" y="50" width="200" height="120" class="card shadow" />
    <rect x="700" y="50" width="200" height="8" fill="#00B060" rx="4" />
    <text x="800" y="100" class="display text-ink" font-size="24" text-anchor="middle">RECEIVER</text>
    <text x="800" y="125" class="mono text-soft" font-size="14" text-anchor="middle">$ dropwire receive</text>
    <rect x="720" y="145" width="160" height="4" rx="2" class="bg" />
  </g>
</svg>
