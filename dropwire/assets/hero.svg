<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800&amp;family=JetBrains+Mono:wght@700&amp;family=Satoshi:wght@500;700&amp;display=swap');
      .bg { fill: #F4EFEA; }
      .text-ink { fill: #0B1016; }
      .text-cream { fill: #F4EFEA; }
      .text-soft { fill: #222C37; }
      .blue { fill: #0052FF; }
      .yellow { fill: #FFB800; }
      .orange { fill: #FF3D00; }
      .green { fill: #00B060; }
      
      .display { font-family: 'Cabinet Grotesk', system-ui, sans-serif; font-weight: 800; }
      .sans { font-family: 'Satoshi', system-ui, sans-serif; font-weight: 500; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
      
      .shadow { filter: drop-shadow(0 16px 40px rgba(11,16,22,0.08)); }
      .card { fill: #FFFFFF; rx: 16px; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .anim-float { animation: float 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="450" class="bg" />
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(11,16,22,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1000" height="450" fill="url(#grid)" />

  <!-- Layout Container -->
  <g transform="translate(60, 60)">
    
    <!-- Tag Pill -->
    <rect x="0" y="0" width="120" height="36" rx="18" class="yellow" />
    <text x="60" y="23" class="mono text-ink" font-size="14" text-anchor="middle">CLI TOOL</text>
    
    <!-- Headline -->
    <text x="0" y="110" class="display text-ink" font-size="86" letter-spacing="-2">DROPWIRE</text>
    
    <!-- Subheadline -->
    <text x="0" y="160" class="sans text-soft" font-size="28">Serverless, end-to-end encrypted P2P file transfers.</text>
    <text x="0" y="195" class="sans text-soft" font-size="28">Send anything, anywhere, at maximum bandwidth.</text>
    
    <!-- Code Block / Terminal Graphic -->
    <g transform="translate(0, 240)">
      <rect width="360" height="64" rx="12" class="blue shadow" />
      <text x="24" y="40" class="mono text-cream" font-size="18">$ dropwire send ./my-app</text>
      <circle cx="330" cy="32" r="6" fill="#00B060" />
    </g>

    <!-- Visual Floating Element Right Side -->
    <g transform="translate(560, -20)" class="anim-float">
      <rect width="320" height="340" class="card shadow" />
      <!-- File Transfer UI Mock -->
      <rect x="24" y="24" width="272" height="48" rx="8" class="bg" />
      <text x="44" y="53" class="sans text-ink" font-size="16" font-weight="700">Connecting to peer...</text>
      
      <rect x="24" y="96" width="272" height="180" rx="16" fill="#F4EFEA" />
      <circle cx="160" cy="160" r="48" class="green" />
      <!-- Lock Icon -->
      <path d="M150 155v-8a10 10 0 1120 0v8h2v16h-24v-16h2z" fill="#FFF" />
      <text x="160" y="234" class="display text-ink" font-size="24" text-anchor="middle">SECURE LINK</text>
      
      <!-- Progress Bar -->
      <rect x="24" y="296" width="272" height="8" rx="4" class="bg" />
      <rect x="24" y="296" width="180" height="8" rx="4" class="orange" />
    </g>

  </g>
</svg>
