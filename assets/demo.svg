<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <rect width="1200" height="600" fill="#0B0F19"/>
  <rect x="100" y="100" width="1000" height="400" rx="8" fill="#131B2F" stroke="#1E293B" stroke-width="2"/>
  <path d="M 100 140 h 1000" stroke="#1E293B" stroke-width="2"/>
  <circle cx="130" cy="120" r="6" fill="#334155"/>
  <circle cx="150" cy="120" r="6" fill="#334155"/>
  <circle cx="170" cy="120" r="6" fill="#334155"/>
  
  <g transform="translate(140 200)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="24">
    <!-- Step 1 -->
    <g id="step1">
      <text x="0" y="0" fill="#94A3B8">$ <tspan fill="#F1F5F9">dropwire send ./large_dataset</tspan></text>
    </g>
    <!-- Step 2 -->
    <g id="step2">
      <text x="0" y="50" fill="#94A3B8">Analyzing payload... <tspan fill="#F1F5F9">45,291 files (1.4 GB)</tspan></text>
      <text x="0" y="90" fill="#94A3B8">Generating secure SPAKE2 code phrase...</text>
    </g>
    <!-- Step 3 -->
    <g id="step3">
      <rect x="0" y="120" width="800" height="80" rx="4" fill="#0B0F19" stroke="#8B5CF6" stroke-width="2"/>
      <text x="20" y="160" fill="#F1F5F9">Code: <tspan fill="#10B981" font-weight="bold">7-purple-monkey</tspan></text>
      <text x="20" y="185" fill="#94A3B8" font-size="18">Waiting for receiver to connect...</text>
    </g>
    <!-- Step 4 -->
    <g id="step4">
      <text x="0" y="250" fill="#10B981">✅ Peer connected securely. Handshake complete.</text>
      <text x="0" y="290" fill="#94A3B8">Transferring ./large_dataset... <tspan fill="#8B5CF6">[1.4 GB/s]</tspan></text>
    </g>
  </g>
</svg>
