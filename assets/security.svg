<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <rect width="1200" height="500" fill="#0B0F19"/>

  <g font-family="-apple-system, sans-serif" font-size="20">
    <g transform="translate(100 200)" id="sender-node">
      <rect width="250" height="100" rx="4" fill="#131B2F" stroke="#1E293B" stroke-width="2"/>
      <text x="125" y="45" fill="#F1F5F9" text-anchor="middle" font-weight="bold">Sender</text>
      <text x="125" y="75" fill="#94A3B8" text-anchor="middle" font-size="16">NAT / Firewall</text>
    </g>

    <g transform="translate(850 200)" id="receiver-node">
      <rect width="250" height="100" rx="4" fill="#131B2F" stroke="#1E293B" stroke-width="2"/>
      <text x="125" y="45" fill="#F1F5F9" text-anchor="middle" font-weight="bold">Receiver</text>
      <text x="125" y="75" fill="#94A3B8" text-anchor="middle" font-size="16">NAT / Firewall</text>
    </g>

    <g transform="translate(475 50)" id="relay-node">
      <rect width="250" height="80" rx="4" fill="#0B0F19" stroke="#8B5CF6" stroke-dasharray="6,4" stroke-width="2"/>
      <text x="125" y="35" fill="#8B5CF6" text-anchor="middle" font-weight="bold">Signaling Relay</text>
      <text x="125" y="60" fill="#94A3B8" text-anchor="middle" font-size="16">Blind to Data</text>
    </g>

    <g id="data-path">
      <path d="M 350 250 L 850 250" fill="none" stroke="#10B981" stroke-width="4"/>
      <text x="600" y="235" fill="#10B981" text-anchor="middle" font-weight="bold">Direct P2P Stream (E2EE)</text>
      <text x="600" y="275" fill="#94A3B8" text-anchor="middle" font-size="16">ChaCha20Poly1305 + BLAKE3</text>
    </g>
  </g>
</svg>
