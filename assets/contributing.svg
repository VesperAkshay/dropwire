<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <rect width="1200" height="400" fill="#0B0F19"/>

  <g font-family="-apple-system, sans-serif" font-size="24">
    <g id="main-line">
      <path d="M 100 200 L 1100 200" fill="none" stroke="#1E293B" stroke-width="4"/>
      <circle cx="300" cy="200" r="16" fill="#131B2F" stroke="#10B981" stroke-width="4"/>
      <circle cx="750" cy="200" r="16" fill="#131B2F" stroke="#10B981" stroke-width="4"/>
    </g>
    
    <g transform="translate(600 200)" id="contrib-node">
      <path d="M 0 0 C 0 -100, 150 -100, 150 0" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8,4"/>
      <circle r="16" fill="#0B0F19" stroke="#8B5CF6" stroke-width="4"/>
      <text x="0" y="-120" fill="#F1F5F9" text-anchor="middle" font-weight="bold">Pull Request / Issue</text>
    </g>
  </g>
</svg>
