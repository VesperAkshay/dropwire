<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%">
  <defs>
    <style>
      @keyframes cursorBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes barGrow { 0%,25%{width:0} 85%,100%{width:338px} }
      @keyframes statsIn { 0%,26%{opacity:0} 30%,100%{opacity:1} }
      @keyframes doneIn { 0%,82%{opacity:0;transform:translateY(4px)} 88%,100%{opacity:1;transform:translateY(0)} }
      @keyframes packetA {
        0%   {transform:translateX(0px);  opacity:0}
        8%   {opacity:1}
        88%  {opacity:1}
        96%  {transform:translateX(58px);opacity:0}
        100% {transform:translateX(58px);opacity:0}
      }
      @keyframes packetB {
        0%,18%  {transform:translateX(0px);opacity:0}
        26%     {opacity:1}
        88%     {opacity:1}
        96%     {transform:translateX(58px);opacity:0}
        100%    {transform:translateX(58px);opacity:0}
      }
      @keyframes nodePulse1 { 0%,100%{opacity:0} 50%{opacity:0.55} }
      @keyframes nodePulse2 { 0%,100%{opacity:0} 50%{opacity:0.55} }
      @keyframes nodePulse3 { 0%,100%{opacity:0} 50%{opacity:0.55} }
      @keyframes nodePulse4 { 0%,100%{opacity:0} 50%{opacity:0.55} }
      @keyframes titleGlow  { 0%,100%{filter:drop-shadow(0 0 6px #d4a83266)} 50%{filter:drop-shadow(0 0 20px #d4a832aa)} }
      @keyframes p1in { 0%,10%{opacity:0;transform:translateY(7px)} 22%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p2in { 0%,20%{opacity:0;transform:translateY(7px)} 32%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p3in { 0%,30%{opacity:0;transform:translateY(7px)} 42%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p4in { 0%,40%{opacity:0;transform:translateY(7px)} 52%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p5in { 0%,50%{opacity:0;transform:translateY(7px)} 62%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p6in { 0%,60%{opacity:0;transform:translateY(7px)} 72%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p7in { 0%,70%{opacity:0;transform:translateY(7px)} 82%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p8in { 0%,78%{opacity:0;transform:translateY(7px)} 88%,100%{opacity:1;transform:translateY(0)} }
      @keyframes p9in { 0%,84%{opacity:0;transform:translateY(7px)} 92%,100%{opacity:1;transform:translateY(0)} }
      .p1{animation:p1in 5s ease both}
      .p2{animation:p2in 5s ease both}
      .p3{animation:p3in 5s ease both}
      .p4{animation:p4in 5s ease both}
      .p5{animation:p5in 5s ease both}
      .p6{animation:p6in 5s ease both}
      .p7{animation:p7in 5s ease both}
      .p8{animation:p8in 5s ease both}
      .p9{animation:p9in 5s ease both}
    </style>

    <!-- Gradients using block-toy palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1917"/>
      <stop offset="100%" stop-color="#2a2926"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a832"/>
      <stop offset="40%"  stop-color="#9b7bb8"/>
      <stop offset="80%"  stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#d4a832"/>
    </linearGradient>
    <linearGradient id="progressFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a832"/>
      <stop offset="100%" stop-color="#ede0c4"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a832"/>
      <stop offset="50%"  stop-color="#f0c860"/>
      <stop offset="100%" stop-color="#d4a832"/>
    </linearGradient>
    <linearGradient id="pktGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9b7bb8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#9b7bb8"/>
      <stop offset="100%" stop-color="#9b7bb8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Dot grid -->
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.7" fill="#3a3733"/>
    </pattern>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="420" fill="url(#bg)" rx="14"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.6" rx="14"/>

  <!-- ambient glows -->
  <ellipse cx="260" cy="280" rx="180" ry="100" fill="#d4a832" opacity="0.04" filter="url(#softGlow)"/>
  <ellipse cx="950" cy="160" rx="240" ry="130" fill="#9b7bb8" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Top brand bar -->
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#topBar)"/>

  <!-- ══════════════ TERMINAL ══════════════ -->
  <rect x="36" y="48" width="448" height="304" rx="11" fill="#232220" stroke="#3a3733" stroke-width="1.5"/>
  <!-- titlebar -->
  <rect x="36" y="48" width="448" height="34" rx="11" fill="#2e2b28"/>
  <rect x="36" y="68"  width="448" height="14" fill="#2e2b28"/>
  <!-- traffic lights — using block palette -->
  <circle cx="62"  cy="65" r="6" fill="#d4a832"/>
  <circle cx="82"  cy="65" r="6" fill="#9b7bb8"/>
  <circle cx="102" cy="65" r="6" fill="#ede0c4"/>
  <text x="260" y="70" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" fill="#6b6560" text-anchor="middle">DropWire — bash</text>

  <!-- Line 1: prompt -->
  <text x="56" y="108" font-family="ui-monospace,monospace" font-size="13" fill="#ede0c4">$</text>
  <text x="70" y="108" font-family="ui-monospace,monospace" font-size="13" fill="#f0e8d8"> DropWire send secret.zip</text>

  <!-- Line 2 -->
  <text x="56" y="132" font-family="ui-monospace,monospace" font-size="12" fill="#6b6560">  → 1 file  (24 MB)  scanned</text>
  <!-- Line 3 -->
  <text x="56" y="152" font-family="ui-monospace,monospace" font-size="12" fill="#6b6560">  SPAKE2 ✓  9ms   BLAKE3 ✓</text>

  <!-- Room code line -->
  <text x="56" y="176" font-family="ui-monospace,monospace" font-size="13">
    <tspan fill="#6b6560">  Code  </tspan>
    <tspan fill="#d4a832" font-weight="700">happy-dog-42</tspan>
  </text>

  <!-- progress bar track -->
  <rect x="56" y="192" width="358" height="7" rx="3.5" fill="#1a1917"/>
  <!-- progress fill animated -->
  <rect x="56" y="192" height="7" rx="3.5" fill="url(#progressFill)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="338" dur="3.2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- stats row -->
  <text x="56" y="216" font-family="ui-monospace,monospace" font-size="12" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <tspan fill="#6b6560">  17.8 / 24 MB</tspan>
    <tspan x="404" text-anchor="end" fill="#9b7bb8">↑ 318 MB/s</tspan>
  </text>

  <!-- done line -->
  <text x="56" y="244" font-family="ui-monospace,monospace" font-size="13" fill="#ede0c4" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.9s" fill="freeze"/>
    ✓ Transfer complete — 0.26s
  </text>

  <!-- cursor -->
  <rect x="56" y="258" width="8" height="14" rx="1" fill="#d4a832" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Packet wire ── -->
  <line x1="486" y1="195" x2="554" y2="195" stroke="#3a3733" stroke-width="2" stroke-dasharray="5 4"/>
  <g>
    <rect x="486" y="189" width="26" height="12" rx="6" fill="url(#pktGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0;68,0" dur="1.5s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="486" y="189" width="18" height="12" rx="6" fill="url(#pktGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0;68,0" dur="1.5s" begin="1.55s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="1.5s" begin="1.55s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════════ PIPELINE COLUMN ══════════════ -->
  <g transform="translate(556,56)">
    <!-- ─ box 1: Chunk ─ -->
    <rect x="0" y="0" width="108" height="44" rx="7" fill="#232220" stroke="#3a3733" stroke-width="1.5"/>
    <text x="54" y="18" font-family="ui-monospace,monospace" font-size="11" fill="#f0e8d8" font-weight="600" text-anchor="middle">1MB Chunks</text>
    <text x="54" y="35" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">parallel I/O</text>
    <rect x="0" y="0" width="108" height="44" rx="7" fill="none" stroke="#d4a832" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </rect>

    <line x1="54" y1="44" x2="54" y2="62" stroke="#3a3733" stroke-width="1.5"/>
    <polygon points="48,59 60,59 54,67" fill="#3a3733"/>
    <!-- animated dot on line -->
    <circle cx="54" cy="44" r="4" fill="#d4a832" opacity="0" filter="url(#glow)">
      <animate attributeName="cy" values="44;62" dur="0.7s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- ─ box 2: BLAKE3 ─ -->
    <rect x="0" y="68" width="108" height="44" rx="7" fill="#232220" stroke="#ede0c4" stroke-width="1.5"/>
    <text x="54" y="86" font-family="ui-monospace,monospace" font-size="11" fill="#ede0c4" font-weight="600" text-anchor="middle">BLAKE3</text>
    <text x="54" y="103" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">Merkle tree</text>
    <rect x="0" y="68" width="108" height="44" rx="7" fill="none" stroke="#ede0c4" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <line x1="54" y1="112" x2="54" y2="130" stroke="#3a3733" stroke-width="1.5"/>
    <polygon points="48,127 60,127 54,135" fill="#3a3733"/>
    <circle cx="54" cy="112" r="4" fill="#ede0c4" opacity="0" filter="url(#glow)">
      <animate attributeName="cy" values="112;130" dur="0.7s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="1.9s" repeatCount="indefinite"/>
    </circle>

    <!-- ─ box 3: zstd ─ -->
    <rect x="0" y="136" width="108" height="44" rx="7" fill="#232220" stroke="#9b7bb8" stroke-width="1.5"/>
    <text x="54" y="154" font-family="ui-monospace,monospace" font-size="11" fill="#9b7bb8" font-weight="600" text-anchor="middle">zstd</text>
    <text x="54" y="171" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">stream compress</text>
    <rect x="0" y="136" width="108" height="44" rx="7" fill="none" stroke="#9b7bb8" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.2s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <line x1="54" y1="180" x2="54" y2="198" stroke="#3a3733" stroke-width="1.5"/>
    <polygon points="48,195 60,195 54,203" fill="#3a3733"/>
    <circle cx="54" cy="180" r="4" fill="#9b7bb8" opacity="0" filter="url(#glow)">
      <animate attributeName="cy" values="180;198" dur="0.7s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="2.3s" repeatCount="indefinite"/>
    </circle>

    <!-- ─ box 4: Noise_XX ─ -->
    <rect x="0" y="204" width="108" height="44" rx="7" fill="#232220" stroke="#f0e8d8" stroke-width="1.5"/>
    <text x="54" y="222" font-family="ui-monospace,monospace" font-size="11" fill="#f0e8d8" font-weight="600" text-anchor="middle">SPAKE2</text>
    <text x="54" y="239" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">ChaCha20</text>
    <rect x="0" y="204" width="108" height="44" rx="7" fill="none" stroke="#f0e8d8" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
    <line x1="54" y1="248" x2="54" y2="266" stroke="#3a3733" stroke-width="1.5"/>
    <polygon points="48,263 60,263 54,271" fill="#3a3733"/>
    <circle cx="54" cy="248" r="4" fill="#f0e8d8" opacity="0" filter="url(#glow)">
      <animate attributeName="cy" values="248;266" dur="0.7s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="2.7s" repeatCount="indefinite"/>
    </circle>

    <!-- ─ box 5: QUIC ─ (larger, primary) -->
    <rect x="-10" y="272" width="128" height="52" rx="8" fill="#1a1917" stroke="#d4a832" stroke-width="2"/>
    <text x="54" y="296" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#d4a832" text-anchor="middle">⚡ TCP</text>
    <text x="54" y="314" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">4 streams</text>
    <!-- outer pulse ring -->
    <rect x="-10" y="272" width="128" height="52" rx="8" fill="none" stroke="#d4a832" opacity="0">
      <animate attributeName="opacity" values="0.55;0;0.55" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;9;2" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════════ TITLE + FEATURES RIGHT ══════════════ -->
  <!-- title -->
  <text x="724" y="126"
    font-family="ui-monospace,SFMono-Regular,monospace"
    font-size="64" font-weight="700"
    fill="url(#titleGrad)"
    style="animation:titleGlow 4s ease-in-out infinite">
    DropWire
  </text>

  <!-- tagline -->
  <text x="726" y="158" font-family="ui-monospace,monospace" font-size="15" fill="#6b6560">Encrypted P2P file transfer.</text>
  <text x="726" y="178" font-family="ui-monospace,monospace" font-size="15" fill="#f0e8d8">No accounts. No cloud. One command.</text>

  <!-- rule -->
  <line x1="726" y1="196" x2="1170" y2="196" stroke="#3a3733" stroke-width="1"/>

  <!-- Feature pills — 9 staggered -->
  <g class="p1">
    <rect x="726" y="208" width="136" height="28" rx="14" fill="#1a1917" stroke="#d4a832" stroke-width="1.2"/>
    <text x="794" y="227" font-family="ui-monospace,monospace" font-size="12" fill="#d4a832" text-anchor="middle">⚡ TCP transport</text>
  </g>
  <g class="p2">
    <rect x="872" y="208" width="140" height="28" rx="14" fill="#1a1917" stroke="#9b7bb8" stroke-width="1.2"/>
    <text x="942" y="227" font-family="ui-monospace,monospace" font-size="12" fill="#9b7bb8" text-anchor="middle">🔐 SPAKE2 E2E</text>
  </g>
  <g class="p3">
    <rect x="1022" y="208" width="136" height="28" rx="14" fill="#1a1917" stroke="#ede0c4" stroke-width="1.2"/>
    <text x="1090" y="227" font-family="ui-monospace,monospace" font-size="12" fill="#ede0c4" text-anchor="middle">✓ BLAKE3 verify</text>
  </g>

  <g class="p4">
    <rect x="726" y="246" width="136" height="28" rx="14" fill="#1a1917" stroke="#f0e8d8" stroke-width="1.2"/>
    <text x="794" y="265" font-family="ui-monospace,monospace" font-size="12" fill="#f0e8d8" text-anchor="middle">📦 zstd compress</text>
  </g>
  <g class="p5">
    <rect x="872" y="246" width="148" height="28" rx="14" fill="#1a1917" stroke="#d4a832" stroke-width="1.2"/>
    <text x="946" y="265" font-family="ui-monospace,monospace" font-size="12" fill="#d4a832" text-anchor="middle">🖥 Interactive TUI</text>
  </g>
  <g class="p6">
    <rect x="1030" y="246" width="128" height="28" rx="14" fill="#1a1917" stroke="#9b7bb8" stroke-width="1.2"/>
    <text x="1094" y="265" font-family="ui-monospace,monospace" font-size="12" fill="#9b7bb8" text-anchor="middle">📡 LAN + relay</text>
  </g>

  <g class="p7">
    <rect x="726" y="284" width="136" height="28" rx="14" fill="#1a1917" stroke="#4a4742" stroke-width="1.2"/>
    <text x="794" y="303" font-family="ui-monospace,monospace" font-size="12" fill="#6b6560" text-anchor="middle">🔄 Resumable</text>
  </g>
  <g class="p8">
    <rect x="872" y="284" width="148" height="28" rx="14" fill="#1a1917" stroke="#4a4742" stroke-width="1.2"/>
    <text x="946" y="303" font-family="ui-monospace,monospace" font-size="12" fill="#6b6560" text-anchor="middle">📂 Folders + files</text>
  </g>
  <g class="p9">
    <rect x="1030" y="284" width="128" height="28" rx="14" fill="#1a1917" stroke="#4a4742" stroke-width="1.2"/>
    <text x="1094" y="303" font-family="ui-monospace,monospace" font-size="12" fill="#6b6560" text-anchor="middle">🦀 Pure Rust</text>
  </g>

  <!-- stat cards -->
  <rect x="726" y="330" width="128" height="56" rx="8" fill="#232220" stroke="#3a3733" stroke-width="1.5"/>
  <text x="790" y="354" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#d4a832" text-anchor="middle">4</text>
  <text x="790" y="374" font-family="ui-monospace,monospace" font-size="11" fill="#6b6560" text-anchor="middle">TCP streams</text>

  <rect x="864" y="330" width="128" height="56" rx="8" fill="#232220" stroke="#3a3733" stroke-width="1.5"/>
  <text x="928" y="354" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#9b7bb8" text-anchor="middle">1MB</text>
  <text x="928" y="374" font-family="ui-monospace,monospace" font-size="11" fill="#6b6560" text-anchor="middle">chunk size</text>

  <rect x="1002" y="330" width="156" height="56" rx="8" fill="#232220" stroke="#3a3733" stroke-width="1.5"/>
  <text x="1080" y="354" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#ede0c4" text-anchor="middle">0</text>
  <text x="1080" y="374" font-family="ui-monospace,monospace" font-size="11" fill="#6b6560" text-anchor="middle">accounts needed</text>

  <!-- footer -->
  <text x="726" y="408" font-family="ui-monospace,monospace" font-size="11" fill="#3a3733">MIT License · Pure Rust · TCP + SPAKE2 + BLAKE3</text>
</svg>
