<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%">
  <defs>
    <style>
      @keyframes flow1 { 0%{offset-distance:0%;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{offset-distance:100%;opacity:0} }
      @keyframes labelIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
      @keyframes boxPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
      @keyframes arrowSlide {
        0%   { stroke-dashoffset: 20 }
        100% { stroke-dashoffset: 0 }
      }
    </style>
    <!-- BG: charcoal -->
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1917"/>
      <stop offset="100%" stop-color="#232220"/>
    </linearGradient>
    <!-- Amber packet gradient -->
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a832" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4a832"/>
      <stop offset="100%" stop-color="#d4a832" stop-opacity="0"/>
    </linearGradient>
    <!-- Cream packet gradient -->
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ede0c4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ede0c4"/>
      <stop offset="100%" stop-color="#ede0c4" stop-opacity="0"/>
    </linearGradient>
    <!-- Violet packet gradient -->
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b7bb8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9b7bb8"/>
      <stop offset="100%" stop-color="#9b7bb8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#4a4742"/>
    </marker>
  </defs>

  <rect width="1200" height="160" fill="url(#pbg)" rx="10"/>
  <rect width="1200" height="2" rx="1" fill="#3a3733"/>
  <rect y="158" width="1200" height="2" rx="1" fill="#3a3733"/>

  <!-- Stage boxes -->
  <!-- 1 Disk -->
  <rect x="20" y="54" width="110" height="52" rx="8" fill="#2e2b28" stroke="#4a4742" stroke-width="1.5"/>
  <text x="75" y="76" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#f0e8d8" text-anchor="middle">💾 Disk</text>
  <text x="75" y="95" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">source file</text>

  <!-- arrow 1 -->
  <line x1="132" y1="80" x2="170" y2="80" stroke="#4a4742" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <!-- animated packet on wire 1 — amber -->
  <rect x="132" y="74" width="22" height="12" rx="6" fill="url(#p1)" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;38,0" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- 2 Chunks — amber border -->
  <rect x="172" y="54" width="130" height="52" rx="8" fill="#2e2b28" stroke="#d4a832" stroke-width="1.5"/>
  <text x="237" y="76" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#d4a832" text-anchor="middle">🧩 Chunk Engine</text>
  <text x="237" y="95" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">1MB · parallel I/O</text>
  <!-- pulsing border -->
  <rect x="172" y="54" width="130" height="52" rx="8" fill="none" stroke="#d4a832" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow 2 -->
  <line x1="304" y1="80" x2="342" y2="80" stroke="#4a4742" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="304" y="74" width="22" height="12" rx="6" fill="url(#p1)" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;38,0" dur="1.4s" begin="0.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- 3 BLAKE3 — cream border -->
  <rect x="344" y="54" width="130" height="52" rx="8" fill="#2e2b28" stroke="#ede0c4" stroke-width="1.5"/>
  <text x="409" y="76" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#ede0c4" text-anchor="middle">✓ BLAKE3</text>
  <text x="409" y="95" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">Merkle tree · verify</text>
  <rect x="344" y="54" width="130" height="52" rx="8" fill="none" stroke="#ede0c4" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow 3 -->
  <line x1="476" y1="80" x2="514" y2="80" stroke="#4a4742" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="476" y="74" width="22" height="12" rx="6" fill="url(#p2)" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;38,0" dur="1.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- 4 zstd — violet border -->
  <rect x="516" y="54" width="130" height="52" rx="8" fill="#2e2b28" stroke="#9b7bb8" stroke-width="1.5"/>
  <text x="581" y="76" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#9b7bb8" text-anchor="middle">📦 zstd</text>
  <text x="581" y="95" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">stream compress</text>
  <rect x="516" y="54" width="130" height="52" rx="8" fill="none" stroke="#9b7bb8" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow 4 -->
  <line x1="648" y1="80" x2="686" y2="80" stroke="#4a4742" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="648" y="74" width="22" height="12" rx="6" fill="url(#p3)" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;38,0" dur="1.4s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- 5 Noise_XX — warm cream border -->
  <rect x="688" y="54" width="140" height="52" rx="8" fill="#2e2b28" stroke="#f0e8d8" stroke-width="1.5"/>
  <text x="758" y="76" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="#f0e8d8" text-anchor="middle">🔐 SPAKE2</text>
  <text x="758" y="95" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">ChaCha20-Poly1305</text>
  <rect x="688" y="54" width="140" height="52" rx="8" fill="none" stroke="#f0e8d8" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow 5 -->
  <line x1="830" y1="80" x2="868" y2="80" stroke="#4a4742" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="830" y="74" width="22" height="12" rx="6" fill="url(#p3)" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;38,0" dur="1.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="1.4s" begin="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- 6 QUIC — amber primary -->
  <rect x="870" y="44" width="150" height="72" rx="8" fill="#1a1917" stroke="#d4a832" stroke-width="2"/>
  <text x="945" y="73" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#d4a832" text-anchor="middle">⚡ TCP</text>
  <text x="945" y="93" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">4 parallel streams</text>
  <!-- pulse outer ring -->
  <rect x="870" y="44" width="150" height="72" rx="8" fill="none" stroke="#d4a832" stroke-width="5" opacity="0">
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="4;10;4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- arrow 6 -->
  <line x1="1022" y1="80" x2="1060" y2="80" stroke="#4a4742" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <rect x="1022" y="74" width="26" height="12" rx="6" fill="url(#p1)" filter="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;38,0" dur="1.4s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="1.4s" begin="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- 7 Peer — cream verified -->
  <rect x="1062" y="54" width="118" height="52" rx="8" fill="#2e2b28" stroke="#ede0c4" stroke-width="1.5"/>
  <text x="1121" y="76" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#ede0c4" text-anchor="middle">💻 Peer</text>
  <text x="1121" y="95" font-family="ui-monospace,monospace" font-size="10" fill="#6b6560" text-anchor="middle">verified ✓</text>
  <rect x="1062" y="54" width="118" height="52" rx="8" fill="none" stroke="#ede0c4" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2s" begin="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- top labels -->
  <text x="75" y="40" font-family="ui-monospace,monospace" font-size="10" fill="#4a4742" text-anchor="middle">source</text>
  <text x="945" y="32" font-family="ui-monospace,monospace" font-size="10" fill="#d4a832" text-anchor="middle">primary transport</text>
  <text x="1121" y="40" font-family="ui-monospace,monospace" font-size="10" fill="#4a4742" text-anchor="middle">destination</text>

  <!-- bottom legend -->
  <text x="600" y="145" font-family="ui-monospace,monospace" font-size="11" fill="#4a4742" text-anchor="middle">Disk → Chunk → Hash → Compress → Encrypt → TCP → Peer</text>
</svg>