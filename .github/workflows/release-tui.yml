name: Release TUI

on:
  push:
    tags:
      - "tui-v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build TUI for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dropwirex
            asset_name: dropwire-tui-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: dropwirex.exe
            asset_name: dropwire-tui-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dropwirex
            asset_name: dropwire-tui-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dropwirex
            asset_name: dropwire-tui-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: ./dropwire-tui
        run: cargo build --release --target ${{ matrix.target }} --bin dropwirex

      - name: Package Linux/macOS
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
        shell: bash

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ..\..\..\${{ matrix.asset_name }}
        shell: pwsh

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DropWire TUI ${{ github.ref_name }}
          body: |
            ## DropWire TUI Release
            This release contains the interactive Terminal User Interface (TUI) for DropWire. 
            
            *Note: The headless CLI is released separately. Please check the `cli-v*` tags for core CLI releases.*

            ### Installation Instructions
            **macOS / Linux:**
            ```bash
            curl -sS https://dropwire.tyes.dev/install-tui.sh | sh
            ```
            **Windows:**
            ```powershell
            irm https://dropwire.tyes.dev/install-tui.ps1 | iex
            ```
            **Cargo (All platforms):**
            ```bash
            cargo install --path ./dropwire-tui
            ```
          files: artifacts/*
